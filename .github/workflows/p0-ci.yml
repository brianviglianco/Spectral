name: Spectral P0 CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: spectral-p0-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.18.0"

jobs:
  p0-baseline:
    name: P0 baseline (make + verify + artifacts)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show repo tree for debug
        run: |
          pwd
          ls -la
          ls -la backend || true
          ls -la backend/package.json backend/package-lock.json || true
          ls -la backend/p0-pipeline.sh backend/p0-verify.sh || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json

      - name: Install deps (backend)
        working-directory: backend
        run: npm ci

      - name: Ensure scripts executable
        working-directory: backend
        run: |
          chmod +x p0-pipeline.sh || true
          chmod +x p0-verify.sh || true

      - name: Run P0 pipeline (make + verify)
        working-directory: backend
        run: ./p0-pipeline.sh | tee reports/ci-p0.log

      - name: Upload P0 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-artifacts-${{ github.sha }}
          path: |
            backend/reports/**/*.*
            backend/reports/**/*
          if-no-files-found: warn

  # Se define pero no corre sin runner self-hosted
  matrix-multi-region:
    name: Matrix multi-region (requires self-hosted + VPN)
    needs: p0-baseline
    runs-on: [ self-hosted, linux, vpn ]
    strategy:
      fail-fast: false
      matrix:
        region: [ de, fr, es, it, nl ]
    steps:
      - name: Placeholder
        run: echo "Self-hosted runner required; job will stay queued if none."
